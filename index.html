<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D3.js 地圖</title>
    <style>
      body {
        margin: 0;
        background: radial-gradient(
          ellipse at center,
          #0b1220 0%,
          #03060d 100%
        );
        overflow: hidden;
      }
      #map {
        width: 100%;
        height: auto;
        display: block;
      }
      #tooltip {
        position: fixed;
        pointer-events: none;
        padding: 6px 8px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border-radius: 4px;
        font-size: 12px;
        opacity: 0;
        transform: translate(-50%, -120%);
        transition: opacity 0.15s;
      }
      .country {
        fill: transparent;
        stroke: #3a4964;
        stroke-width: 0.5;
      }
      .country.hover {
        fill: #2a3a56 !important;
      }
    </style>
  </head>

  <body>
    <div id="tooltip"></div>
    <svg
      id="map"
      viewBox="0 0 1000 520"
      preserveAspectRatio="xMidYMid meet"
    ></svg>
  </body>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>
  <script>
    const svg = d3.select('#map');
    const g = svg.append('g');
    const defs = svg.append('defs');
    const tooltip = document.getElementById('tooltip');

    // 創建兩個 group 來組織層級：國家在底層，流星在上層
    const countriesGroup = g.append('g').attr('class', 'countries-group');
    const meteorsGroup = g.append('g').attr('class', 'meteors-group');

    const baseWidth = 1000,
      baseHeight = 520;

    const projection = d3
      .geoNaturalEarth1()
      .scale(170)
      .translate([baseWidth / 2, baseHeight / 2]);
    const path = d3.geoPath(projection);

    // 經緯度 [經度, 緯度] - mockdata
    // time：API 提供的絕對時間戳記（ISO 字串），流星連線依照這個時間先後出發，
    // 時間相同的會同時發生，時間分開的就只有一條在飛
    const flows = [
      { src: [-77.0, 38.9], dst: [100.5, 13.7], time: '2026-09-16T10:00:00Z' }, // Washington → Bangkok
      { src: [-47.9, -15.8], dst: [100.5, 13.7], time: '2026-09-16T10:00:00Z' }, // Brasília → Bangkok
      { src: [-74.0, 40.7], dst: [100.5, 13.7], time: '2026-09-16T10:00:02Z' }, // New York → Bangkok
      { src: [-0.1, 51.5], dst: [100.5, 13.7], time: '2026-09-16T10:00:03Z' }, // London → Bangkok
      { src: [-77.0, 38.9], dst: [139.7, 35.7], time: '2026-09-16T10:00:03Z' }, // Washington → Tokyo
      { src: [-47.9, -15.8], dst: [2.3, 48.9], time: '2026-09-16T10:00:05Z' }, // Brasília → Paris
      { src: [-74.0, 40.7], dst: [-0.1, 51.5], time: '2026-09-16T10:00:08Z' }, // New York → London
      { src: [-0.1, 51.5], dst: [116.4, 39.9], time: '2026-09-16T10:00:08Z' }, // London → Beijing
      { src: [139.7, 35.7], dst: [100.5, 13.7], time: '2026-09-16T10:00:10Z' }, // Tokyo → Bangkok
      { src: [2.3, 48.9], dst: [13.4, 52.5], time: '2026-09-16T10:00:13Z' }, // Paris → Berlin
      { src: [151.2, -33.9], dst: [139.7, 35.7], time: '2026-09-16T10:00:15Z' }, // Sydney → Tokyo
      { src: [116.4, 39.9], dst: [72.9, 19.1], time: '2026-09-16T10:00:15Z' }, // Beijing → Mumbai
      { src: [37.6, 55.8], dst: [-74.0, 40.7], time: '2026-09-16T10:00:18Z' }, // Moscow → New York
      { src: [72.9, 19.1], dst: [100.5, 13.7], time: '2026-09-16T10:00:20Z' }, // Mumbai → Bangkok
    ];

    // Glow 濾鏡
    const glow = defs
      .append('filter')
      .attr('id', 'glow')
      .attr('filterUnits', 'userSpaceOnUse');
    glow
      .append('feGaussianBlur')
      .attr('stdDeviation', 2)
      .attr('result', 'blur');
    const merge = glow.append('feMerge');
    merge.append('feMergeNode').attr('in', 'blur');
    merge.append('feMergeNode').attr('in', 'SourceGraphic');

    // 載入地圖
    loadWorld().then((world) => {
      const countries = topojson.feature(
        world,
        world.objects.countries
      ).features;

      // 畫地圖（在 countriesGroup 中）
      const countryPaths = countriesGroup
        .selectAll('path.country')
        .data(countries)
        .join('path')
        .attr('class', 'country')
        .attr('d', path)
        .on('mousemove', (event, d) => {
          const name = d.properties?.name || d.properties?.NAME || 'Unknown';
          tooltip.textContent = name;
          tooltip.style.opacity = 1;
          tooltip.style.left = event.clientX + 'px';
          tooltip.style.top = event.clientY + 'px';
          d3.select(event.currentTarget).classed('hover', true);
        })
        .on('mouseout', (event) => {
          tooltip.style.opacity = 0;
          d3.select(event.currentTarget).classed('hover', false);
        });

      // 為每條線加上漸層
      flows.forEach((f, i) => {
        const [x1, y1] = projection(f.src);
        const [x2, y2] = projection(f.dst);
        const grad = defs
          .append('linearGradient')
          .attr('id', `meteorGradient${i}`)
          .attr('x1', x1)
          .attr('y1', y1)
          .attr('x2', x2)
          .attr('y2', y2)
          .attr('gradientUnits', 'userSpaceOnUse');
        grad
          .append('stop')
          .attr('offset', '0%')
          .attr('stop-color', '#ffffff')
          .attr('stop-opacity', 0);
        grad
          .append('stop')
          .attr('offset', '30%')
          .attr('stop-color', '#7df9ff')
          .attr('stop-opacity', 0.8);
        grad
          .append('stop')
          .attr('offset', '100%')
          .attr('stop-color', '#0ff')
          .attr('stop-opacity', 1);
      });

      // 流星線條（在 meteorsGroup 中，確保在國家之上）
      const meteors = meteorsGroup
        .selectAll('path.meteor')
        .data(flows.map((f, i) => ({ f, i })))
        .join('path')
        .attr('class', 'meteor')
        .attr('d', (d) => {
          const [x1, y1] = projection(d.f.src);
          const [x2, y2] = projection(d.f.dst);
          return `M${x1},${y1} L${x2},${y2}`;
        })
        .attr('stroke', (d) => `url(#meteorGradient${d.i})`)
        .attr('stroke-width', 0.5)
        .attr('stroke-linecap', 'round')
        .attr('filter', 'url(#glow)')
        .attr('opacity', 0) // 初始不顯示，等排到自己的時間才由 fly() 畫出來
        .attr('stroke-dasharray', function () {
          const total = this.getTotalLength();
          return `0,${total}`;
        });

      const METEOR_SPEED = 0.1; // px / ms，所有流星線統一用這個速度飛行，不受距離長短影響
      const LOOP_GAP = 1000; // 一輪（所有連線）播完後，等多久才從頭重播下一輪（ms）

      animate();

      // ✅ 依照 API 提供的 time 欄位排隊播放流星動畫 + 國家亮起效果
      // 做法：找出這批資料裡最早的時間當作第 0 毫秒，其餘連線依照跟最早時間的
      // 差距（ms）用 setTimeout 排隊出發；時間相同就會同時出發，時間分開就會
      // 各自獨立出現。全部播完後，等 LOOP_GAP 再從頭重播整批。
      function animate() {
        const times = flows.map((f) => new Date(f.time).getTime());
        const startTime = Math.min(...times);
        let cycleEnd = 0;

        meteors.each(function (d, i) {
          const p = d3.select(this);
          const total = this.getTotalLength();
          const dur = total / METEOR_SPEED; // 依實際像素長度換算時長，確保點到點速度一致
          const frontDur = dur * 0.5;
          const fadeDur = dur * 0.25;
          const delay = times[i] - startTime; // 這條連線相對於這一輪開始的出發時間

          cycleEnd = Math.max(cycleEnd, delay + frontDur + fadeDur);

          setTimeout(() => fly(p, d, total, frontDur, fadeDur), delay);
        });

        // setTimeout(animate, cycleEnd + LOOP_GAP); // 循環
      }

      // 單一流星飛行一次：起點亮起 → 前進 → 終點亮起 → 淡出
      function fly(p, d, total, frontDur, fadeDur) {
        // 起點亮起（流星效果開始時）
        highlightCountry(d.f.src, '#1998a8');

        p.attr('stroke-dasharray', `0,${total}`)
          .attr('stroke-dashoffset', 0)
          .attr('opacity', 1)
          .transition()
          .duration(frontDur)
          .ease(d3.easeCubicInOut)
          // 前進：尾巴維持一定長度
          .attrTween('stroke-dasharray', function () {
            const head = d3.interpolate(0, total);
            return (t) => `${head(t)},${total}`;
          })
          .attr('stroke-dashoffset', 0)
          .on('end', () => {
            // 終點亮起（流星到達末尾點時）
            highlightCountry(d.f.dst, '#817ed4');
          })
          .transition()
          // 第二段動畫：淡出
          .duration(fadeDur)
          .ease(d3.easeCubicOut)
          .attr('opacity', 0)
          .on('end', () => {
            p.attr('stroke-dasharray', `0,0`).attr('stroke-dashoffset', 0);
          });
      }

      // 國家短暫亮起（柔和淡入淡出）
      function highlightCountry(coord, color = 'blue') {
        const [x, y] = projection(coord);
        console.log('尋找國家:', coord, color);

        let foundCountry = null;
        let minDist = Infinity;
        let closestCountry = null;

        // 先嘗試找到包含該座標的國家（使用 d3.geoContains 檢查地理座標）
        countryPaths.each(function (d) {
          // 使用 d3.geoContains 檢查地理座標是否在國家內
          if (d3.geoContains(d, coord)) {
            foundCountry = d3.select(this);
            console.log(
              '找到包含該點的國家:',
              d.properties?.name || d.properties?.NAME
            );
            return;
          }

          // 同時記錄最接近的國家（作為備選）
          const [cx, cy] = projection(d3.geoCentroid(d));
          const dist = Math.hypot(cx - x, cy - y);
          if (dist < minDist) {
            minDist = dist;
            closestCountry = d3.select(this);
          }
        });

        // 如果找到包含該點的國家，使用它；否則使用最接近的國家
        const country = foundCountry || (minDist < 300 ? closestCountry : null);

        if (country && !country.empty()) {
          const countryName =
            country.datum()?.properties?.name ||
            country.datum()?.properties?.NAME ||
            'Unknown';
          console.log('將要亮起國家:', countryName, '距離:', minDist);
          country
            .transition()
            .duration(200)
            .style('fill', color) // 使用 style 而不是 attr，因為 CSS 優先級更高
            .transition()
            .delay(1000)
            .duration(400)
            .style('fill', 'transparent');

          // 確保流星線條始終在最上層（在國家高亮後）
          meteors.raise();
        } else {
          console.log('未找到國家，最小距離:', minDist);
        }
      }

      // zoom / pan
      // svg.call(
      //   d3
      //     .zoom()
      //     .scaleExtent([1, 8])
      //     .on('zoom', (ev) => g.attr('transform', ev.transform))
      // );
    });

    function loadWorld() {
      return d3.json('world-110m.json').catch(() => d3.json('world-110m.json'));
    }
  </script>
</html>
