<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>流量地圖</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="./css/style.css" />
  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
</head>
<body>
  <div id="map"></div>

  <!-- 流量播放控制 -->
  <div class="playback" role="group" aria-label="流量播放">
    <button type="button" id="play-toggle" aria-label="暫停">❚❚</button>
    <span id="play-clock" class="clock">—</span>
    <select id="play-speed" aria-label="播放倍速"></select>
    <span id="play-count" class="count"></span>
    <span class="legend" role="group" aria-label="顯示的層級">
      <label><input type="checkbox" data-layer="L7" checked /><i class="l7"></i>L7</label>
      <label><input type="checkbox" data-layer="L4" checked /><i class="l4"></i>L4</label>
    </span>
  </div>

  <div id="loading" class="loading">載入中…</div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
